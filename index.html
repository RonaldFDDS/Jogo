<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrevista</title>
</head>
<body>
     <main>
        <div class="passo ativo" id="passo-0">
<img src="img/escritorio.jpg" alt="">
<p>Você chega em sua entrevista de emprego, aplicando para uma vaga que vai mudar a sua vida.</p>
            <button class="btn-proximo" data-proximo="1">Chegar em silêncio e ir se sentar direto.</button>
            <button class="btn-proximo" data-proximo="2">Cumprimentar o recrutador e se apresentar.</button>
        </div>
        <div class="passo" id="passo-1">
            <p>Com licença, qual é o seu nome?.</p>
            <button class="btn-proximo" data-proximo="2">Meu nome é Jerferson, eu tenho 18 anos e desejo entrar na empresa.</button>
            <button class="btn-proximo" data-proximo="3">Jerfeson.</button>
        </div>
        <div class="passo" id="passo-2">
            <p>Bom dia Jerferson, por que você está aplicando para essa vaga?.</p>
            <button class="btn-proximo" data-proximo="3">Eu preciso de dinheiro para sustentar meu vicio em drogas.</button>
            <button class="btn-proximo" data-proximo="4">As minhas habilidades se aplicam as necessidades da empresa.</button>
        </div>
         <div class="passo" id="passo-3">
            <p>Você não foi contratado.</p>
         </div>
                 <div class="passo" id="passo-4">
            <p>Continuar a historia.</p>
            <button class="btn-proximo" data-proximo="5">Resposta 1.</button>
            <button class="btn-proximo" data-proximo="6">Resposta 2.</button>
        </div>
<script src="script.js"></script>
